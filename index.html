<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="st-version" content="d44ec85efc88">
<title>Suspended Tech Toolbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ST Toolbox">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1a1a1a; color: #e6e6e6; font: 16px -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
  label { display: block; color: #9a9a9a; font-size: 14px; margin: 0 0 14px; }
  input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 11px 10px; font-size: 17px;
          background: #262626; color: #e6e6e6; border: 1px solid #3a3a3a; border-radius: 0; }
  input:focus { outline: none; border-color: #4a9eff; }
  button { width: 100%; margin-top: 8px; padding: 12px; font-size: 17px; background: #4a9eff; color: #fff; border: none; border-radius: 0; }
  button:disabled { opacity: 0.5; }
  #msg { min-height: 22px; margin-top: 14px; color: #ff6b6b; font-size: 14px; }
  #msg.info { color: #9a9a9a; }
  button.second { background: #262626; color: #e6e6e6; border: 1px solid #3a3a3a; margin-top: 18px; }
  #ver { margin-top: 28px; color: #6a6a6a; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Suspended Tech Toolbox</h1>
  <form id="form" hidden>
    <label>Login<input id="login" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button id="go">Log in</button>
  </form>
  <div id="msg" class="info">Opening…</div>
  <button id="reset" class="second" hidden>Reset the offline copy</button>
  <div id="ver"></div>
</main>
<script type="module" src="lock.js"></script>
<script>
  // lock.js did not start at all (still "Opening…" after 15 s): the way out without it
  setTimeout(function () {
    var msg = document.getElementById('msg');
    if (msg.textContent !== 'Opening…') return;
    msg.textContent = 'The login page did not start. Tap Reset (your data stay).';
    msg.className = '';
    var b = document.getElementById('reset');
    b.hidden = false;
    b.onclick = function () {
      var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
      sw.then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
        .catch(function () {})
        .then(function () { location.replace('./'); });
    };
  }, 15000);
</script>
</body>
</html>
